# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          # DESCRIPTION claims R >= 4.1.0, the floor ggplot2 4.0.0 sets. The
          # %||% bug fixed in 0.7.1 broke exactly this range unnoticed.
          - {os: ubuntu-latest,  r: 'oldrel-2'}
          - {os: ubuntu-latest,  r: 'oldrel-3'}
          - {os: ubuntu-latest,  r: 'oldrel-4'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # CRAN's R 4.6 macOS binaries are zstd/xz-compressed and pak cannot
      # extract them yet (r-lib/pkgdepends#485). Posit Package Manager still
      # serves gzip binaries. Pointing CRAN at PPM makes setup-r write it into
      # the repos option, which pak::lockfile_create() resolves against; the
      # RSPM env var alone does not affect that resolution.
      CRAN: https://packagemanager.posit.co/cran/latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # 'always' forces Posit Package Manager on macOS too. CRAN's R 4.6
          # macOS binaries are zstd/xz-compressed and pak cannot extract them
          # yet (r-lib/pkgdepends#485); PPM still serves gzip binaries.
          use-public-rspm: always

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
