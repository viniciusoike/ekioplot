# EKIO brand palette source of truth.
# Edit this file, then run data-raw/palettes.R to rebuild R/sysdata.rda.
#
# scales:   nine-step ramps, light -> dark. Position i == shade i * 100.
# palettes: ordered colors. A member is a literal hex code, or a
#           <name>.<key> reference to a scale shade (blue.700) or to a named
#           token group (gold.light, basic.pivot).
#
# The scales and the accent tokens are generated, not hand-picked:
# data-raw/build-ramps.R holds one OKLCH specification - a shared lightness
# spine, a shared chroma arc, and a hue path plus chroma budget per family -
# and data-raw/palettes.R checks the hex below against it. Do not edit them by
# hand; edit the spec and regenerate. The spine pins blue.700 to the brand
# navy #1E3A5F.
#
# Because every scale sits on the same spine, shade number carries the same
# visual weight in every family: blue.500 and orange.500 are interchangeable
# in weight, and shade 500 passes WCAG AA for text on the off-white surface
# in all seven.

scales:
  blue:
    100: "#E8F6FF"
    200: "#B1D8F2"
    300: "#84B8DD"
    400: "#5597CC"
    500: "#3E76AC"
    600: "#305687"
    700: "#1E3A5F"
    800: "#152A44"
    900: "#0D1B2A"

  gray:
    100: "#F2F3F5"
    200: "#CFD2D5"
    300: "#AEB1B5"
    400: "#8D9197"
    500: "#6E7378"
    600: "#52555A"
    700: "#373A3D"
    800: "#28292C"
    900: "#191A1C"

  stone:
    100: "#F5F3F1"
    200: "#D4D1CD"
    300: "#B4B0AB"
    400: "#959089"
    500: "#76716B"
    600: "#59544F"
    700: "#3C3935"
    800: "#2B2926"
    900: "#1B1A18"

  teal:
    100: "#E2F9FA"
    200: "#AFDCDD"
    300: "#7EBEC0"
    400: "#40A2A3"
    500: "#158281"
    600: "#006261"
    700: "#004342"
    800: "#013031"
    900: "#051F20"

  green:
    100: "#E7F9EC"
    200: "#BADCC3"
    300: "#8FBE9C"
    400: "#62A274"
    500: "#448255"
    600: "#2E623B"
    700: "#1C4326"
    800: "#14301C"
    900: "#0D1F12"

  orange:
    100: "#FFF1E5"
    200: "#F7C7A0"
    300: "#E49F6C"
    400: "#D3742A"
    500: "#B15400"
    600: "#893A00"
    700: "#612400"
    800: "#471904"
    900: "#2D1106"

  red:
    100: "#FFEFED"
    200: "#FDC1B7"
    300: "#E9998E"
    400: "#D76D63"
    500: "#B44D47"
    600: "#8C3431"
    700: "#622020"
    800: "#461818"
    900: "#2D1010"

palettes:
  # Accent tokens: single colors, not ramps. Gold has no nine-step scale
  # because dark yellow is brown - past the middle of the spine a gold ramp
  # stops being gold. These three sit on spine rungs 300, 400 and 500, so they
  # keep the same weight as a scale shade, and `deep` clears WCAG AA on the
  # off-white surface. Generated by data-raw/build-ramps.R alongside the
  # scales; named rather than positional, so `.ekio("gold", "mid")` works.
  accent:
    gold:
      light: "#D5AA48"
      mid: "#B88715"
      deep: "#966800"

  # The categorical palette picks a different shade per hue on purpose. Past
  # five categories `full` separates by hue rather than lightness, so it does
  # not survive grayscale printing.
  categorical:
    full: ["blue.700", "orange.400", "teal.600", "gold.light", "red.500", "green.500", "gray.700", "stone.300"]

  sequential:
    blue: ["blue.100", "blue.200", "blue.300", "blue.400", "blue.500", "blue.600", "blue.700", "blue.800", "blue.900"]
    gray: ["gray.100", "gray.200", "gray.300", "gray.400", "gray.500", "gray.600", "gray.700", "gray.800", "gray.900"]
    stone: ["stone.100", "stone.200", "stone.300", "stone.400", "stone.500", "stone.600", "stone.700", "stone.800", "stone.900"]
    teal: ["teal.100", "teal.200", "teal.300", "teal.400", "teal.500", "teal.600", "teal.700", "teal.800", "teal.900"]
    green: ["green.100", "green.200", "green.300", "green.400", "green.500", "green.600", "green.700", "green.800", "green.900"]
    orange: ["orange.100", "orange.200", "orange.300", "orange.400", "orange.500", "orange.600", "orange.700", "orange.800", "orange.900"]
    red: ["red.100", "red.200", "red.300", "red.400", "red.500", "red.600", "red.700", "red.800", "red.900"]

  # Both arms step through the even shades, so the two halves carry equal
  # weight rung for rung. The pivot is a neutral one step lighter than either
  # arm's innermost color, which puts the visual center of the scale on the
  # data's zero.
  diverging:
    blue_orange: ["blue.800", "blue.600", "blue.400", "blue.200", "basic.pivot", "orange.200", "orange.400", "orange.600", "orange.800"]
    blue_red: ["blue.800", "blue.600", "blue.400", "blue.200", "basic.pivot", "red.200", "red.400", "red.600", "red.800"]
    teal_orange: ["teal.800", "teal.600", "teal.400", "teal.200", "basic.pivot", "orange.200", "orange.400", "orange.600", "orange.800"]

  # Third-party sets, not EKIO color: viridis, inferno and plasma are stop
  # samples of the matplotlib colormaps; okabe_ito is the Okabe & Ito
  # color-universal-design set. See inst/COPYRIGHTS.
  scientific:
    okabe_ito: ["#E69F00", "#56B4E9", "#009E73", "#F0E442", "#0072B2", "#D55E00", "#CC79A7", "#000000"]
    viridis: ["#440154", "#482677", "#3F4A8A", "#31678E", "#26838F", "#1F9D8A", "#6CCE5A", "#B6DE2B", "#FEE825"]
    inferno: ["#000004", "#1B0C41", "#4A0C6B", "#781C6D", "#A52C60", "#CF4446", "#ED6925", "#FB9B06", "#F7D03C", "#FCFFA4"]
    plasma: ["#0D0887", "#46039F", "#7201A8", "#9C179E", "#BD3786", "#D8576B", "#ED7953", "#FB9F3A", "#FDCA26", "#F0F921"]

  # Surfaces, inverted text and the diverging pivot: chrome, not something
  # data maps onto. Named rather than positional, looked up as
  # .ekio("basic", "white"). White, offwhite and black are the only hand-set
  # EKIO hex codes; the pivot is generated with the scales.
  basic:
    basic:
      white: "#FFFFFF"
      offwhite: "#FEFEFE"
      pivot: "#F5F3EF"
      black: "#000000"
