# EKIO brand palette source of truth.
# Edit this file, then run data-raw/palettes.R to rebuild R/sysdata.rda.
#
# scales:   nine-step ramps, light -> dark. Position i == shade i * 100.
# palettes: ordered colors. A member is a literal hex code, or a
#           <name>.<key> reference to a scale shade (blue.700) or to a named
#           token group (gold.light, basic.pivot).
#
# The scales and the accent tokens are generated, not hand-picked:
# data-raw/build-ramps.R holds one OKLCH specification - a shared lightness
# spine, a shared chroma arc, and a hue path plus chroma budget per family -
# and data-raw/palettes.R checks the hex below against it. Do not edit them by
# hand; edit the spec and regenerate. The spine pins blue.700 to the brand
# navy #1E3A5F.
#
# Because every scale sits on the same spine, shade number carries the same
# visual weight in every family: blue.500 and orange.500 are interchangeable
# in weight, and shade 500 passes WCAG AA for text on every surface
# theme_ekio() names, except the `gray` alias.

scales:
  blue:
    100: "#E8F6FF"
    200: "#B0D6F0"
    300: "#82B5DA"
    400: "#5194C8"
    500: "#3A71A8"
    600: "#2E5485"
    700: "#1E3A5F"
    800: "#152A44"
    900: "#0D1B2A"

  gray:
    100: "#F2F3F5"
    200: "#CED0D4"
    300: "#ABAEB3"
    400: "#898E93"
    500: "#6A6E74"
    600: "#505358"
    700: "#373A3D"
    800: "#28292C"
    900: "#191A1C"

  stone:
    100: "#F5F3F1"
    200: "#D3D0CC"
    300: "#B2AEA8"
    400: "#928C85"
    500: "#726D66"
    600: "#56524D"
    700: "#3C3935"
    800: "#2B2926"
    900: "#1B1A18"

  teal:
    100: "#E2F9FA"
    200: "#ADDADC"
    300: "#7BBBBD"
    400: "#3C9E9F"
    500: "#097E7D"
    600: "#00605E"
    700: "#004342"
    800: "#013031"
    900: "#051F20"

  green:
    100: "#E7F9EC"
    200: "#B8DAC2"
    300: "#8DBC9A"
    400: "#5F9E70"
    500: "#407D51"
    600: "#2C6039"
    700: "#1C4326"
    800: "#14301C"
    900: "#0D1F12"

  orange:
    100: "#FFF1E5"
    200: "#F6C59F"
    300: "#E19D6A"
    400: "#CF7126"
    500: "#AB5000"
    600: "#863900"
    700: "#612400"
    800: "#471904"
    900: "#2D1106"

  red:
    100: "#FFEFED"
    200: "#FBC0B6"
    300: "#E6968B"
    400: "#D3695F"
    500: "#AF4942"
    600: "#89322F"
    700: "#622020"
    800: "#461818"
    900: "#2D1010"

  purple:
    100: "#FDEEFF"
    200: "#E2C4E9"
    300: "#C49ED2"
    400: "#A877BD"
    500: "#86589C"
    600: "#684079"
    700: "#4B2A55"
    800: "#361F3C"
    900: "#231425"

palettes:
  # Accent tokens and categorical palettes. Gold has no nine-step scale
  # because dark yellow is brown - past the middle of the spine a gold ramp
  # stops being gold. Its three tokens sit on spine rungs 300, 400 and 500,
  # while the blue and orange accents pair one main color with receding grays.
  accent:
    gold:
      light: "#D2A745"
      mid: "#B4840C"
      deep: "#916400"
    # The first four colors reproduce the original four-color accent palettes.
    # The additional gray positions make `n = 2..6` useful in small multiples.
    accent_blue: ["blue.700", "gray.500", "gray.400", "gray.300", "gray.200", "gray.100"]
    accent_orange: ["orange.400", "gray.500", "gray.400", "gray.300", "gray.200", "gray.100"]

  # EKIO identity colors extracted from Hokusai's Inume Pass in Kai Province.
  # This palette is for brand assets and other identity work, not general data
  # visualization.
  brand:
    ekio_brand:
      Baltic Blue: "#225A7E"
      Alabaster Grey: "#D4DED9"
      Soft Linen: "#EFE8DC"
      Air Force Blue: "#517A90"
      Soft Linen 2: "#F2EDE2"
      white: "#FFFFFF"
      black: "#000000"

  # Categorical palettes pick a different shade per hue on purpose. Past five
  # categories `full` separates by hue rather than lightness, so it does not
  # survive grayscale printing. `full_muted` keeps the same sequence but moves
  # each color one rung darker.
  categorical:
    full: ["blue.700", "orange.400", "teal.600", "gold.light", "red.500", "green.500", "gray.700", "stone.300"]
    full_muted: ["blue.800", "orange.500", "teal.700", "gold.mid", "red.600", "green.600", "gray.800", "stone.400"]
    cool3: ["blue.700", "blue.400", "teal.600"]
    cool4: ["blue.700", "blue.400", "teal.600", "green.500"]

  sequential:
    blue: ["blue.100", "blue.200", "blue.300", "blue.400", "blue.500", "blue.600", "blue.700", "blue.800", "blue.900"]
    gray: ["gray.100", "gray.200", "gray.300", "gray.400", "gray.500", "gray.600", "gray.700", "gray.800", "gray.900"]
    stone: ["stone.100", "stone.200", "stone.300", "stone.400", "stone.500", "stone.600", "stone.700", "stone.800", "stone.900"]
    teal: ["teal.100", "teal.200", "teal.300", "teal.400", "teal.500", "teal.600", "teal.700", "teal.800", "teal.900"]
    green: ["green.100", "green.200", "green.300", "green.400", "green.500", "green.600", "green.700", "green.800", "green.900"]
    orange: ["orange.100", "orange.200", "orange.300", "orange.400", "orange.500", "orange.600", "orange.700", "orange.800", "orange.900"]
    red: ["red.100", "red.200", "red.300", "red.400", "red.500", "red.600", "red.700", "red.800", "red.900"]
    purple: ["purple.100", "purple.200", "purple.300", "purple.400", "purple.500", "purple.600", "purple.700", "purple.800", "purple.900"]

  # Both arms step through matching shades, so the two halves carry equal
  # weight rung for rung. Stopping at shade 600 keeps the endpoints balanced
  # for filled areas rather than reaching the near-black end of each scale.
  # The pivot is a neutral lighter than either arm's innermost color, which
  # puts the visual center of the scale on the data's zero.
  diverging:
    purple_orange: ["purple.600", "purple.500", "purple.300", "purple.200", "basic.pivot", "orange.200", "orange.300", "orange.500", "orange.600"]
    blue_red: ["blue.600", "blue.500", "blue.300", "blue.200", "basic.pivot", "red.200", "red.300", "red.500", "red.600"]
    teal_orange: ["teal.600", "teal.500", "teal.300", "teal.200", "basic.pivot", "orange.200", "orange.300", "orange.500", "orange.600"]
    purple_green: ["purple.600", "purple.500", "purple.300", "purple.200", "basic.pivot", "green.200", "green.300", "green.500", "green.600"]

  # Third-party sets, not EKIO color: viridis, inferno and plasma are stop
  # samples of the matplotlib colormaps; okabe_ito is the Okabe & Ito
  # color-universal-design set. See inst/COPYRIGHTS.
  scientific:
    okabe_ito: ["#E69F00", "#56B4E9", "#009E73", "#F0E442", "#0072B2", "#D55E00", "#CC79A7", "#000000"]
    viridis: ["#440154", "#482677", "#3F4A8A", "#31678E", "#26838F", "#1F9D8A", "#6CCE5A", "#B6DE2B", "#FEE825"]
    inferno: ["#000004", "#1B0C41", "#4A0C6B", "#781C6D", "#A52C60", "#CF4446", "#ED6925", "#FB9B06", "#F7D03C", "#FCFFA4"]
    plasma: ["#0D0887", "#46039F", "#7201A8", "#9C179E", "#BD3786", "#D8576B", "#ED7953", "#FB9F3A", "#FDCA26", "#F0F921"]

  # Surfaces, inverted text and the diverging pivot: chrome, not something
  # data maps onto. Named rather than positional, looked up as
  # .ekio("basic", "white"). The surfaces and black are the only hand-set
  # EKIO hex codes; the pivot is generated with the scales.
  #
  # The three surfaces span one axis, warm to cold, and no two of them sit
  # closer than dE2000 1.7. offwhite is unohana-iro and cold is enpaku, both
  # traditional Japanese whites:
  #   https://www.i-iro.com/dic/unohana-iro
  #   https://www.i-iro.com/dic/enpaku
  # Two further candidates were dropped as duplicates of colors already here:
  # gofun-iro #FFFFFC and nyuhakushoku #FFFFFB land within dE2000 1 of each
  # other, within 2 of white, and within 1 of offwhite.
  basic:
    basic:
      white: "#FFFFFF"
      offwhite: "#FBFBF6"
      cold: "#F6F7F8"
      pivot: "#F5F3EF"
      black: "#000000"
